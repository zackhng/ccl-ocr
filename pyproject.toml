[project]
name = "ocr-engine"
version = "0.1.0"
description = "CCL-based OCR engine for financial documents — Phases 0-2 + Phase 6 PaddleOCR bake-off"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.2",
]

[project.optional-dependencies]
# Reserved for Phase 3+ (tiny CNN). Not imported by any Phase 0-2 code path.
train = ["torch>=2.2"]
# Baseline engines used only by the Phase 6 bake-off and by scripts/review_gt.py
# for bootstrapping ground truth on real images that ship without transcripts.
#
# paddlepaddle is pinned to 3.1.x deliberately. 3.3.x crashes in the PP-OCRv5 detector
# with oneDNN enabled (ConvertPirAttribute2RuntimeAttribute, Windows CPU), and running
# it with oneDNN off is ~5x slower — which would hand the CCL engine a latency win it
# did not earn. 3.2.2 works but is ~1.7x slower than 3.1.1 on CPU.
baselines = ["paddleocr>=3.0,<4", "paddlepaddle>=3.1,<3.2"]
fetch = ["requests>=2.31", "huggingface-hub>=0.23"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr", "src/ocrbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
