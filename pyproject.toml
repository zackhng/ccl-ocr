[project]
name = "ocr-engine"
version = "0.1.0"
description = "CCL-based OCR engine for financial documents — Phases 0-2 (benchmark, CCL, filtering)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.2",
]

[project.optional-dependencies]
# Reserved for Phase 3+ (tiny CNN). Not imported by any Phase 0-2 code path.
train = ["torch>=2.2"]
# Baseline engines used only by the Phase 6 bake-off and by scripts/review_gt.py
# for bootstrapping ground truth on real images that ship without transcripts.
baselines = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
fetch = ["requests>=2.31", "huggingface-hub>=0.23"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr", "src/ocrbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
